name: Собрать образ РАДО

on:

  push:

    branches: [main]

  workflow_dispatch:

permissions:

  contents: read

  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Освободить место

        run: |

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

          sudo docker image prune --all --force

          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя образа строчными буквами

        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rado-gpu:latest" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6

        with:

          context: .

          push: true

          tags: ${{ env.IMG }}

